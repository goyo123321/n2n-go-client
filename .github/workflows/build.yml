name: Build Client

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布 Release（true=构建并发布，false=测试构建）'
        required: true
        type: boolean
        default: false
      version:
        description: '发布版本号，如 v1.2.0（仅 publish=true 时需要）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # ============================================================
  # 参数校验：仅发布模式运行
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    if: inputs.publish
    steps:
      - name: Check version
        shell: bash
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            echo "::error::发布模式必须提供 version"
            {
              echo "## ❌ 参数校验失败"
              echo ""
              echo "发布模式必须提供 \`version\`（如 \`v1.2.0\`）。"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::version 格式错误：${{ inputs.version }}"
            {
              echo "## ❌ 参数校验失败"
              echo ""
              echo "version 格式错误：\`${{ inputs.version }}\`"
              echo ""
              echo "要求：\`vX.Y.Z\`，例如 \`v1.2.0\`。"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ version 校验通过：${{ inputs.version }}"

  # ============================================================
  # 构建：测试 / 发布两种模式都跑
  #   - 每个平台永远 exit 0，让其它平台继续跑
  #   - 真实结果通过 output 传递；错误日志写入 summary
  #   - 发布模式下，失败的平台会 fail 当前 job，阻断 release
  # ============================================================
  build:
    needs: [validate]
    if: |
      always() &&
      (!inputs.publish || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # Windows 构建需要 wintun.dll（被 //go:embed 引用）
      - name: Prepare wintun.dll
        id: wintun
        if: matrix.goos == 'windows'
        shell: bash
        continue-on-error: true
        run: |
          set -e
          WINTUN_VERSION=0.14.1
          echo "下载 wintun ${WINTUN_VERSION} ..."
          curl -fsSL -o wintun.zip "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip"
          unzip -q wintun.zip -d wintun-extract
          cp wintun-extract/wintun/bin/amd64/wintun.dll ./wintun.dll
          ls -lh wintun.dll

      # ----------------------------------------------------------
      # 核心构建步骤
      #   永远 exit 0；输出、退出码写到文件与 output
      # ----------------------------------------------------------
      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p dist

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          OUT="n2n-client-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          LOG="dist/build-${{ matrix.goos }}-${{ matrix.goarch }}.log"

          LD_FLAGS="-s -w"
          if [ -n "${{ inputs.version }}" ]; then
            LD_FLAGS="$LD_FLAGS -X main.BuildVersion=${{ inputs.version }}"
          fi

          {
            echo "========== 构建开始 =========="
            echo "时间: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "GOOS=${{ matrix.goos }}"
            echo "GOARCH=${{ matrix.goarch }}"
            echo "OUT=$OUT"
            echo "LD_FLAGS=$LD_FLAGS"
            echo "Go 版本: $(go version)"
            echo "========== 构建输出 =========="
          } > "$LOG"

          # 捕获 stdout + stderr 到日志文件，同时打印
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=0 \
            go build -trimpath -ldflags "$LD_FLAGS" -o "dist/$OUT" . \
            2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}

          {
            echo "========== 构建结束 =========="
            echo "退出码: $RC"
            echo "时间: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } >> "$LOG"

          echo "rc=$RC" >> $GITHUB_OUTPUT
          echo "out=$OUT" >> $GITHUB_OUTPUT
          echo "log=$LOG" >> $GITHUB_OUTPUT

          if [ $RC -eq 0 ]; then
            echo "✅ 构建成功：$OUT"
          else
            echo "::warning::构建失败：${{ matrix.goos }}-${{ matrix.goarch }} (rc=$RC)"
          fi

          exit 0

      # ----------------------------------------------------------
      # 把每个平台的结果写到 Summary
      #   包含：成功/失败、产物、大小、失败时的错误日志尾部
      # ----------------------------------------------------------
      - name: Record to summary
        if: always()
        shell: bash
        run: |
          RC="${{ steps.build.outputs.rc }}"
          PLATFORM="${{ matrix.goos }}-${{ matrix.goarch }}"
          OUT="${{ steps.build.outputs.out }}"
          LOG="${{ steps.build.outputs.log }}"
          PUBLISH="${{ inputs.publish }}"

          # 检测 wintun 步骤是否失败（仅 Windows 平台）
          WINTUN_RESULT="${{ steps.wintun.outcome }}"

          {
            echo "### 平台 \`$PLATFORM\`"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          # ---- 失败：写入错误详情 ----
          if [ "$RC" != "0" ] || [ "$WINTUN_RESULT" = "failure" ]; then
            {
              echo "❌ **构建失败**"
              echo ""
              if [ "$WINTUN_RESULT" = "failure" ]; then
                echo "**前置步骤 wintun.dll 下载失败**（Windows 构建必需）"
                echo ""
              fi
              if [ -n "$RC" ] && [ "$RC" != "0" ]; then
                echo "**退出码**：\`$RC\`"
                echo ""
              fi
              if [ "$PUBLISH" = "true" ]; then
                echo "> ⚠️ **发布模式**：此平台失败会导致 Release 被阻断。"
                echo ""
              else
                echo "> ℹ️ **测试模式**：不会阻断其它平台。"
                echo ""
              fi
            } >> $GITHUB_STEP_SUMMARY

            # 错误日志（最后 60 行）
            if [ -f "$LOG" ]; then
              {
                echo "<details><summary>构建日志（最后 60 行）</summary>"
                echo ""
                echo '```'
                tail -n 60 "$LOG"
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              } >> $GITHUB_STEP_SUMMARY
            else
              {
                echo "_没有捕获到日志文件（$LOG）_"
                echo ""
              } >> $GITHUB_STEP_SUMMARY
            fi

          # ---- 成功 ----
          else
            {
              echo "✅ **构建成功**"
              echo ""
              echo "产物：\`$OUT\`"
            } >> $GITHUB_STEP_SUMMARY

            if [ -f "dist/$OUT" ]; then
              SIZE=$(stat -c%s "dist/$OUT" 2>/dev/null || stat -f%z "dist/$OUT" 2>/dev/null || echo 0)
              SIZE_HR=$(numfmt --to=iec-i --suffix=B "$SIZE" 2>/dev/null || echo "${SIZE}B")
              {
                echo ""
                echo "大小：\`$SIZE_HR\`"
              } >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      # ----------------------------------------------------------
      # 上传 artifact（成功平台）
      # ----------------------------------------------------------
      - name: Upload artifact
        if: always() && steps.build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: n2n-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/n2n-client-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------
      # 上传错误日志（失败平台，便于排查）
      # ----------------------------------------------------------
      - name: Upload error log
        if: always() && steps.build.outputs.rc != '0'
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/build-${{ matrix.goos }}-${{ matrix.goarch }}.log
          if-no-files-found: warn
          retention-days: 30

      # ----------------------------------------------------------
      # 发布模式下：失败时 fail 当前 job（阻断 release）
      #   但 summary 已经在上面写入了完整错误信息
      # ----------------------------------------------------------
      - name: Enforce publish mode
        if: inputs.publish && (steps.build.outputs.rc != '0' || steps.wintun.outcome == 'failure')
        shell: bash
        run: |
          echo "::error::发布模式下构建失败，Release 已阻断：${{ matrix.goos }}-${{ matrix.goarch }}"
          exit 1

  # ============================================================
  # Release：仅发布模式且 build 全部成功时运行
  # ============================================================
  release:
    needs: build
    if: inputs.publish && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: n2n-client-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: |
          echo "::group::所有产物"
          ls -lh dist/
          echo "::endgroup::"
          {
            echo "## 📦 Release ${{ inputs.version }}"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in dist/n2n-client-*; do
              if [ -f "$f" ]; then
                SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
                SIZE_HR=$(numfmt --to=iec-i --suffix=B "$SIZE" 2>/dev/null || echo "${SIZE}B")
                echo "| \`$(basename $f)\` | $SIZE_HR |"
              fi
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: dist/n2n-client-*
          draft: false
          prerelease: false
          generate_release_notes: true

  # ============================================================
  # 发布失败汇总：发布模式下且 build 失败时运行
  #   把整体结论写到 summary，明确告知 Release 未发生
  # ============================================================
  summary-publish-fail:
    needs: build
    if: always() && inputs.publish && needs.build.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write fail summary
        shell: bash
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "# ❌ 发布未执行"
            echo ""
            echo "构建阶段有平台失败，Release 已被阻断。"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发者 | \`${{ github.actor }}\` |"
            echo "| 目标版本 | \`${{ inputs.version }}\` |"
            echo "| build job 结果 | \`${{ needs.build.result }}\` |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "**下一步**：查看上方各平台 Summary 里的错误日志，修复后重新触发工作流。"
          } >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # 测试模式汇总：publish=false 时最后跑一次
  # ============================================================
  summary-test:
    needs: build
    if: always() && !inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "# 🧪 测试构建完成"
            echo ""
            echo "> 本模式**不发布 Release**。产物已上传为 Actions Artifact，保留 30 天。"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发者 | \`${{ github.actor }}\` |"
            echo "| build job 结果 | \`${{ needs.build.result }}\` |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "各平台详细结果见上方矩阵 job 的 Summary。"
            echo ""
            echo "**如果 build job 是绿色但上方有平台标红**：说明该平台失败了但不影响整体（测试模式的预期行为）。"
            echo ""
            echo "如需发布 Release：重新触发本工作流，**publish 勾选 true**，并填写 version（如 \`v1.2.0\`）。"
          } >> $GITHUB_STEP_SUMMARY
